<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#12151c" />
  <meta name="description" content="Wdeck - client web per lo Stream Deck software" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Wdeck</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <!-- schermata di accesso: token o PIN -->
  <section id="gate" class="gate" hidden>
    <div class="gate-card">
      <h1>Wdeck</h1>
      <p class="gate-sub" data-i18n="gate.subtitle">Collega questo dispositivo all'host.</p>

      <label class="field">
        <span data-i18n="gate.host">Indirizzo host</span>
        <input id="gate-host" type="text" inputmode="url" autocomplete="off" placeholder="http://192.168.1.10:8899" />
      </label>

      <label class="field">
        <span data-i18n="gate.pin">PIN di accoppiamento</span>
        <input id="gate-pin" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="es. 246810" />
      </label>

      <button id="gate-pair" class="btn primary" type="button" data-i18n="gate.pair">Associa con PIN</button>

      <details class="gate-advanced">
        <summary data-i18n="gate.haveToken">Ho gia' un token</summary>
        <label class="field">
          <span data-i18n="gate.token">Token</span>
          <input id="gate-token" type="text" autocomplete="off" placeholder="token dell'host" />
        </label>
        <button id="gate-token-save" class="btn" type="button" data-i18n="gate.useToken">Usa questo token</button>
      </details>

      <p id="gate-error" class="gate-error" role="alert"></p>
    </div>
  </section>

  <!-- applicazione -->
  <main id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span id="status-dot" class="dot" data-state="offline" title="stato connessione"></span>
        <strong id="deck-name">Wdeck</strong>
        <span id="dry-badge" class="badge warn" hidden>DRY-RUN</span>
        <button id="btn-update" class="badge update" type="button" hidden data-i18n="top.update">Aggiornamento</button>
      </div>
      <nav class="topbar-right">
        <select id="profile-select" class="select" aria-label="Profilo" data-i18n-label="top.profile"></select>
        <button id="btn-edit" class="icon-btn" type="button" title="Modifica il deck" data-i18n-title="top.edit" aria-pressed="false">&#9998;</button>
        <button id="btn-simulate" class="icon-btn" type="button" title="Simula le azioni (dry-run lato client)" data-i18n-title="top.simulate" aria-pressed="false">SIM</button>
        <button id="btn-fullscreen" class="icon-btn" type="button" title="Schermo intero" data-i18n-title="top.fullscreen">&#9974;</button>
        <button id="btn-settings" class="icon-btn" type="button" title="Impostazioni" data-i18n-title="top.settings">&#9881;</button>
      </nav>
    </header>

    <!-- computer collegati: uno per PC su cui gira l'host -->
    <div id="hosts" class="hosts" role="tablist" aria-label="Computer"></div>

    <div id="pages" class="pages" role="tablist"></div>

    <section id="grid" class="grid" aria-label="Griglia bottoni"></section>

    <footer class="statusbar">
      <span id="status-text" data-i18n="status.offline">non connesso</span>
      <span id="last-action" class="last-action"></span>
    </footer>
  </main>

  <!-- pannello modale riusato da editor, impostazioni e conferme -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title">Titolo</h2>
        <button id="sheet-close" class="icon-btn" type="button" data-close="1" title="Chiudi" data-i18n-title="sheet.close">&#10005;</button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
      <footer id="sheet-foot" class="sheet-foot"></footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
