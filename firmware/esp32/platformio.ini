; Wdeck - firmware ESP32 con display TFT touch
;
; Compilazione:  pio run
; Flash + monitor:  pio run -t upload -t monitor
;
; L'ambiente predefinito e' pensato per una scheda ESP32 dev con display
; ILI9341 320x240 e touch resistivo XPT2046 (la combinazione piu' diffusa).
; Le altre schede sono configurate negli ambienti in fondo al file.

[platformio]
default_envs = esp32-ili9341

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; --- credenziali e host (sovrascrivibili senza toccare il codice) ---
    ; -DWDECK_WIFI_SSID='"NOME-RETE"'
    ; -DWDECK_WIFI_PASS='"PASSWORD"'
    ; -DWDECK_HOST_ADDR='"192.168.1.10"'
    ; -DWDECK_HOST_PORT=8899
    ; -DWDECK_TOKEN='"il-token-dell-host"'

; ---------------------------------------------------------------------------
; ESP32 dev + ILI9341 320x240 + touch XPT2046 (SPI condiviso)
; ---------------------------------------------------------------------------
[env:esp32-ili9341]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21
    -DTOUCH_CS=22
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DWDECK_TFT_ROTATION=1

; ---------------------------------------------------------------------------
; ESP32-2432S028R ("cheap yellow display"): ILI9341 + XPT2046 su bus separati
; ---------------------------------------------------------------------------
[env:esp32-cyd]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DWDECK_TFT_ROTATION=1

; ---------------------------------------------------------------------------
; ESP32-S3 + ST7789 320x240 (display senza touch: usare i pulsanti hardware)
; ---------------------------------------------------------------------------
[env:esp32s3-st7789]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=15
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DWDECK_TFT_ROTATION=3
